# Load this from a Mock site config after adjusting plugin_dir.
config_opts['plugin_dir'] = '/path/to/clang-wrap/mock'
config_opts['plugins'] = ['llvmir_rpm'] + config_opts.get('plugins', [])
config_opts['environment']['PATH'] = '/var/lib/clang-wrap:' + config_opts['environment']['PATH']
config_opts['macros']['%toolchain'] = 'clang'

config_opts['llvmir_rpm_enable'] = True
config_opts['llvmir_rpm_opts'] = {
    'enable': True,
    'package_suffix': '-llvmir',
}