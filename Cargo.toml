[package]
name = "clang-wrap"
version = "0.1.0"
edition = "2021"

[dependencies]
md5 = "0.7"
hex = "0.4"
goblin = "0.10"
pathdiff = "0.2"
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "clang"
path = "src/main.rs"

[[bin]]
name = "ar"
path = "src/bin/ar-wrap.rs"

[[bin]]
name = "install"
path = "src/bin/install-wrap.rs"

[[bin]]
name = "ln"
path = "src/bin/ln-wrap.rs"

[[bin]]
name = "mv"
path = "src/bin/mv-wrap.rs"

[[bin]]
name = "cp"
path = "src/bin/cp-wrap.rs"

[[bin]]
name = "strip"
path = "src/bin/strip-wrap.rs"

[[bin]]
name = "meson-install"
path = "src/bin/meson-install.rs"
